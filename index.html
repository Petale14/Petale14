<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#FF6B6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pétale">
<title>Pétale — Ton journal vocal & créatif</title>
<link rel="manifest" href="manifest.json">
<script src="capacitor.js" onerror="console.log('Capacitor not available, using localStorage')"></script>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Dancing+Script:wght@400;600&family=Pacifico&family=Shadows+Into+Light&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --coral:#FF6B6B;--orange:#FF8E53;--pink:#FF6FAE;--violet:#9B5DE5;
  --coral-l:#FFF0EC;--orange-l:#FFF4EE;--pink-l:#FFF0F7;--violet-l:#F5F0FF;
  --coral-d:#8B2500;--orange-d:#7B3000;--pink-d:#7B1A50;--violet-d:#3D1A7A;
  --paper:#FFFBF8;--line:#F0E8E0;--margin:rgba(255,107,174,0.3);
  --text:#2C2010;--text2:#8A6A50;--text3:#C0A898;--bg2:#FDF5F0;--border:#F0DDD0;
  --grad:linear-gradient(135deg,#FF6B6B,#FF8E53,#FF6FAE);
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);min-height:100vh;}
#app{width:100%;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:var(--nav-h);}
.screen{display:none;}.screen.active{display:block;}

/* REC BAR */
.rec-bar{display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--coral);color:#fff;padding:8px 1rem;align-items:center;gap:8px;z-index:60;font-size:13px;font-weight:500;}
.rec-bar.on{display:flex;}
.rec-dot{width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.rec-stop{margin-left:auto;background:rgba(255,255,255,0.25);border:none;color:#fff;padding:4px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;}

/* BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--paper);border-top:0.5px solid var(--border);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);}
.bottom-nav.visible{display:flex;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--text3);font-size:10px;gap:3px;transition:color 0.15s;}
.nav-btn i{font-size:22px;}
.nav-btn.active{color:var(--coral);}

/* ONBOARDING */
.ob-wrap{min-height:100vh;text-align:center;}
.ob-top{background:var(--grad);padding:3rem 1.5rem 2rem;}
.ob-logo{font-size:13px;font-weight:600;letter-spacing:0.22em;color:rgba(255,255,255,0.8);text-transform:uppercase;margin-bottom:0.75rem;}
.ob-flower{font-size:48px;margin-bottom:0.75rem;}
.ob-title{font-size:28px;font-weight:700;color:#fff;line-height:1.25;margin-bottom:8px;}
.ob-title em{font-style:normal;}
.ob-sub{font-size:15px;color:rgba(255,255,255,0.85);line-height:1.6;font-style:italic;}
.ob-body{padding:1.5rem;}
.lang-bar{display:flex;justify-content:center;gap:8px;margin-bottom:1.75rem;}
.lang-btn{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--paper);font-size:13px;cursor:pointer;font-family:inherit;color:var(--text2);}
.lang-btn.active{border-color:var(--coral);color:var(--coral);font-weight:600;background:var(--coral-l);}
.ob-btn{width:100%;padding:1rem;border-radius:14px;border:none;font-size:16px;font-weight:700;color:#fff;background:var(--grad);cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(255,107,107,0.4);}

/* HOME */
.home-hdr{padding:1.1rem 1rem 0.25rem;display:flex;align-items:center;justify-content:space-between;background:var(--paper);}
.home-logo{font-size:13px;font-weight:700;letter-spacing:0.14em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;}
.lang-mini{font-size:12px;color:var(--text2);cursor:pointer;background:var(--paper);border:0.5px solid var(--border);font-family:inherit;padding:4px 9px;border-radius:8px;}
.home-gr{font-size:20px;font-weight:500;color:var(--text);padding:0 1rem 0.2rem;background:var(--paper);}
.home-dt{font-size:13px;color:var(--text2);padding:0 1rem 0.75rem;background:var(--paper);}

/* GARDEN */
.g-card{margin:0 1rem 0.75rem;border-radius:20px;overflow:hidden;box-shadow:0 2px 12px rgba(255,107,107,0.12);}
.g-card-top{background:var(--grad);padding:0.9rem 1.1rem 0.75rem;display:flex;align-items:center;justify-content:space-between;}
.g-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.9);}
.g-add-btn{font-size:12px;background:rgba(255,255,255,0.25);border:none;color:#fff;padding:5px 12px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600;}
.garden-area{height:100px;position:relative;overflow:hidden;transition:background 0.5s;}
.g-flower{position:absolute;animation:popIn 0.5s ease;font-size:26px;}
@keyframes popIn{0%{transform:scale(0) translateY(20px);opacity:0;}70%{transform:scale(1.2) translateY(-3px);}100%{transform:scale(1) translateY(0);opacity:1;}}
.g-empty{display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:#2D6A4F;font-style:italic;cursor:pointer;}
.g-stats{background:var(--paper);display:flex;justify-content:space-around;padding:0.75rem 0;}
.g-stat{text-align:center;}
.g-val{font-size:17px;font-weight:700;color:var(--text);}
.g-lbl2{font-size:11px;color:var(--text2);margin-top:1px;}

/* JOURNALS LIST */
.sec-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;padding:0 1rem;margin:0.75rem 0 0.5rem;}
.j-list{padding:0 1rem 1.5rem;display:flex;flex-direction:column;gap:9px;}
.j-card{border-radius:16px;padding:0.9rem 1rem;cursor:pointer;border:0.5px solid transparent;display:flex;align-items:center;gap:11px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.j-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.j-name{font-size:15px;font-weight:600;}
.j-sub{font-size:12px;margin-top:1px;}

/* FULL LINED PAGE */
.j-page{min-height:100vh;background-color:var(--paper);background-image:linear-gradient(var(--margin) 0,var(--margin) 100%),repeating-linear-gradient(transparent,transparent 35px,var(--line) 35px,var(--line) 36.5px);background-size:1.5px 100%,100% 36.5px;background-position:40px 0,0 56px;background-attachment:local;background-repeat:no-repeat,repeat;}
.j-hdr{position:sticky;top:0;z-index:20;padding:0.75rem 1rem 0.5rem;display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--border);background:var(--paper);}
.back-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:20px;padding:4px;}
.j-hdr-title{font-size:17px;font-weight:700;flex:1;}
.j-hdr-icon{background:none;border:none;cursor:pointer;color:var(--text2);font-size:18px;padding:4px;}
.j-inner{padding:0 1rem 0 48px;padding-bottom:5rem;}
.j-date-block{padding:1.1rem 0 0.5rem;}
.j-date-main{font-size:21px;font-weight:700;line-height:1.25;margin-bottom:3px;}
.j-date-desc{font-size:13px;color:var(--text3);font-style:italic;}
.slot-num{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin:1.1rem 0 2px;}
.slot-prompt{font-size:13px;color:var(--text3);font-style:italic;margin-bottom:3px;}
.slot-ta{width:100%;border:none;outline:none;background:transparent;line-height:2;resize:none;min-height:44px;caret-color:var(--coral);padding:0;}
.slot-ta::placeholder{color:var(--text3);font-style:italic;}
.divider{border:none;border-top:0.5px dashed var(--line);margin:0.75rem 0;}
.deep-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin:1.25rem 0 4px;display:flex;align-items:center;gap:5px;}

/* TYPO & COLOR */
.typo-row{display:flex;gap:6px;overflow-x:auto;padding:0.5rem 0 0.25rem;}
.typo-row::-webkit-scrollbar{display:none;}
.t-btn{flex-shrink:0;padding:5px 11px;border-radius:20px;border:1.5px solid transparent;background:var(--bg2);cursor:pointer;font-size:15px;color:var(--text);white-space:nowrap;}
.t-btn.active{background:var(--coral-l);border-color:var(--coral);}
.color-row{display:flex;gap:7px;align-items:center;padding:0.25rem 0 0.5rem;flex-wrap:wrap;}
.c-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.c-dot.active{outline:2.5px solid var(--coral);outline-offset:1px;}
.c-sep{font-size:11px;color:var(--text3);}

/* MIC HERO */
.mic-hero-wrap{padding:1.5rem 0 0.75rem;text-align:center;position:sticky;bottom:0;z-index:15;background:linear-gradient(to bottom,transparent,var(--paper) 45%);margin-top:-1.5rem;}
.mic-hero{display:inline-flex;flex-direction:column;align-items:center;gap:5px;padding:1rem 2.5rem;border-radius:20px;border:none;cursor:pointer;font-family:inherit;background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(255,107,107,0.35);transition:transform 0.15s;}
.mic-hero:active{transform:scale(0.97);}
.mic-hero.rec{animation:pulseMic 1.5s infinite;}
@keyframes pulseMic{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
.mic-hero-ico{font-size:28px;}
.mic-hero-lbl{font-size:14px;font-weight:700;}
.mic-hero-hint{font-size:11px;opacity:0.9;}
.save-btn{width:100%;padding:0.8rem;border-radius:13px;border:0.5px solid var(--border);background:var(--paper);cursor:pointer;font-size:14px;color:var(--text2);font-family:inherit;margin-top:0.25rem;}

/* WEEK HIGHLIGHT */
.week-hl{border-radius:14px;padding:0.9rem 1rem;margin-top:1.25rem;background:linear-gradient(135deg,#F0FFD0,#E4FFB0);}
.wh-title{font-size:11px;font-weight:700;color:#3A5500;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.wh-item{font-size:13px;color:#3A5500;padding:3px 0 3px 10px;border-left:2px solid #7AAF00;margin-bottom:4px;}

/* SCRAPBOOK */
.scrap-wrap{position:relative;min-height:220px;padding-bottom:2rem;}
.scrap-ta{width:100%;border:none;outline:none;background:transparent;line-height:2;resize:none;min-height:80px;overflow:hidden;caret-color:var(--violet);padding:0;position:relative;z-index:2;}
.scrap-ta::placeholder{color:var(--text3);font-style:italic;}
/* Canvas unifié — mêmes dimensions dans édition, preview et Mon journal */
.petale-canvas{position:relative;min-height:350px;padding-bottom:3rem;}
.free-item{position:absolute;cursor:grab;user-select:none;touch-action:none;}
.free-item:active{cursor:grabbing;}
.free-item.is-photo{z-index:5;}
.free-item.is-photo img{display:block;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.free-item.is-sticker{font-size:28px;line-height:1;z-index:10;}
.free-item.is-sticker img{display:block;object-fit:contain;}
.i-del{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--coral);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:15;border:none;line-height:1;}
.rh{position:absolute;bottom:-5px;right:-5px;width:14px;height:14px;background:white;border:2px solid var(--violet);border-radius:3px;cursor:se-resize;z-index:15;}
.opacity-bar{position:absolute;bottom:-28px;left:0;min-width:100px;background:rgba(0,0,0,0.65);border-radius:0 0 6px 6px;padding:4px 7px;display:none;align-items:center;gap:5px;z-index:20;}
.opacity-bar input[type=range]{flex:1;min-width:70px;height:14px;cursor:pointer;}
.opacity-bar button{background:none;border:none;color:#fff;cursor:pointer;font-size:12px;padding:0;line-height:1;}

/* TOOLBAR */
.toolbar{background:var(--bg2);border-top:0.5px solid var(--border);padding:0.75rem 1rem;}
.tb-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.tb-sec{font-size:11px;color:var(--text2);min-width:52px;font-weight:500;}
.s-row{display:flex;flex-wrap:wrap;gap:6px;}
.s-btn{font-size:22px;cursor:pointer;background:none;border:none;padding:1px;line-height:1;}
.photo-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;border:0.5px solid var(--pink);background:var(--pink-l);color:var(--pink-d);font-size:13px;cursor:pointer;font-family:inherit;}
.arrange-btn{padding:5px 10px;border-radius:8px;border:0.5px solid var(--border);background:var(--paper);font-size:12px;cursor:pointer;font-family:inherit;color:var(--text2);}
.arrange-btn.on{background:var(--violet-l);color:var(--violet-d);border-color:var(--violet);}
.prem-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;}
.prem-badge{font-size:10px;background:#F5E6C8;color:#5C4500;border-radius:20px;padding:2px 7px;font-weight:600;}
.tb-hint{font-size:11px;color:var(--violet);font-style:italic;display:none;margin-top:4px;}
.tb-hint.show{display:block;}

/* QUESTIONS */
.q-area{padding:0.75rem 0 0.25rem;}
.q-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;}
.q-chips{display:flex;flex-wrap:wrap;gap:5px;}
.q-chip{font-size:12px;padding:4px 10px;border-radius:20px;cursor:pointer;border:0.5px solid var(--pink);color:var(--pink-d);background:var(--pink-l);font-family:inherit;}

/* PRINT */
.print-t{border-radius:13px;padding:0.85rem 1rem;background:linear-gradient(135deg,var(--orange-l),var(--coral-l));border:0.5px solid #FFCDB8;display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:0.5rem;}
.pt-title{font-size:13px;font-weight:700;color:var(--coral-d);}
.pt-sub{font-size:12px;color:var(--orange-d);margin-top:2px;line-height:1.4;}
.pt-badge{font-size:10px;background:#FFE0CC;color:var(--coral-d);border-radius:20px;padding:2px 8px;font-weight:600;white-space:nowrap;}

/* MON JOURNAL SCREEN */
.screen-hdr{padding:1.1rem 1rem 0.75rem;background:var(--paper);border-bottom:0.5px solid var(--border);}
.screen-hdr-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:12px;padding:8px 12px;border:0.5px solid var(--border);}
.search-bar input{flex:1;background:transparent;border:none;outline:none;font-size:14px;color:var(--text);font-family:inherit;}
.search-bar input::placeholder{color:var(--text3);}
.filter-tabs{display:flex;gap:6px;padding:0.6rem 1rem;overflow-x:auto;border-bottom:0.5px solid var(--border);}
.filter-tabs::-webkit-scrollbar{display:none;}
.ftab{padding:5px 12px;border-radius:20px;border:1.5px solid transparent;background:var(--bg2);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--text2);white-space:nowrap;}
.ftab.active{border-color:var(--coral);background:var(--coral-l);color:var(--coral-d);}
.jnl-entries{padding:0.75rem 1rem;}
.jnl-card{border-radius:14px;padding:1rem;margin-bottom:10px;cursor:pointer;border:0.5px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.jnl-card-date{font-size:12px;font-weight:600;margin-bottom:5px;text-transform:capitalize;}
.jnl-card-type{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:6px;}
.jnl-card-text{font-size:14px;color:var(--text);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.jnl-card-meta{font-size:11px;color:var(--text3);margin-top:6px;display:flex;gap:10px;}
.jnl-empty{text-align:center;padding:3rem 1rem;font-size:14px;color:var(--text3);font-style:italic;}

/* STATS SCREEN */
.stats-wrap{padding:0 1rem 2rem;}
.stats-hero{background:var(--grad);border-radius:20px;padding:1.5rem;text-align:center;margin:0.75rem 0;}
.stats-hero-num{font-size:52px;font-weight:700;color:#fff;line-height:1;}
.stats-hero-lbl{font-size:14px;color:rgba(255,255,255,0.85);margin-top:4px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;}
.stats-card{background:var(--paper);border-radius:16px;padding:1rem;border:0.5px solid var(--border);text-align:center;}
.stats-card-num{font-size:28px;font-weight:700;color:var(--text);}
.stats-card-lbl{font-size:12px;color:var(--text2);margin-top:3px;}
.cal-wrap{background:var(--paper);border-radius:16px;padding:1.5rem;border:0.5px solid var(--border);margin-bottom:1rem;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;}
.cal-title{font-size:16px;font-weight:700;color:var(--text);}
.cal-nav{display:flex;gap:8px;}
.cal-nav-btn{background:none;border:none;cursor:pointer;color:var(--coral);font-size:20px;padding:4px;transition:all 0.2s;}
.cal-nav-btn:active{transform:scale(0.9);}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px;}
.cal-weekday{text-align:center;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;padding:6px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-day{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--text);background:var(--bg2);position:relative;cursor:pointer;transition:all 0.2s;}
.cal-day.other-month{color:var(--text3);opacity:0.4;}
.cal-day.today{background:var(--coral);color:#fff;font-weight:700;}
.cal-day.active{background:var(--coral-l);border:2px solid var(--coral);}
.cal-day-flower{font-size:16px;position:absolute;top:-6px;right:-2px;}

/* SETTINGS SCREEN */
.settings-wrap{padding:0.75rem 1rem 2rem;}
.settings-section{margin-bottom:1.25rem;}
.settings-section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px;padding-left:4px;}
.settings-item{background:var(--paper);border-radius:14px;padding:0.9rem 1rem;margin-bottom:6px;display:flex;align-items:center;gap:12px;cursor:pointer;border:0.5px solid var(--border);}
.settings-item-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.settings-item-title{font-size:14px;font-weight:500;color:var(--text);}
.settings-item-sub{font-size:12px;color:var(--text2);margin-top:1px;}
.settings-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;margin-left:auto;white-space:nowrap;}
.settings-badge.premium{background:#F5E6C8;color:#5C4500;}
.settings-badge.v2{background:var(--violet-l);color:var(--violet-d);}

/* HISTORY */
.hist-date-card{padding:1rem 1rem 0.5rem;border-bottom:0.5px solid var(--border);cursor:pointer;}
.hist-date-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
.hist-preview{font-size:13px;color:var(--text2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-empty{text-align:center;padding:3rem 1rem;font-size:14px;color:var(--text3);font-style:italic;}
.hist-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:6px;}

/* PREVIEW OVERLAY */
.preview-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;align-items:flex-end;justify-content:center;}
.preview-ov.open{display:flex;}
.preview-sheet{background:var(--paper);border-radius:24px 24px 0 0;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;}
.preview-page{background-color:var(--paper);background-image:linear-gradient(rgba(255,107,174,0.25) 0,rgba(255,107,174,0.25) 100%),repeating-linear-gradient(transparent,transparent 35px,var(--line) 35px,var(--line) 36.5px);background-size:1.5px 100%,100% 36.5px;background-position:38px 0,0 0;background-repeat:no-repeat,repeat;padding:1.25rem 1rem 2rem 48px;position:relative;min-height:320px;}
.preview-date{font-size:18px;font-weight:700;margin-bottom:0.75rem;}
.preview-text{line-height:2;white-space:pre-wrap;word-break:break-word;position:relative;z-index:2;}
.preview-free-layer{position:absolute;top:0;left:0;right:0;min-height:100%;pointer-events:none;}
.preview-photo{position:absolute;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.preview-sticker{position:absolute;line-height:1;}.preview-sticker img{}
.preview-close{width:100%;padding:0.85rem;border:none;background:var(--grad);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:0 0 24px 24px;}

/* FLOWER PICKER */
.flower-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end;justify-content:center;}
.flower-ov.open{display:flex;}
.flower-sheet{background:var(--paper);border-radius:24px 24px 0 0;padding:1.75rem 1.5rem 2.5rem;width:100%;max-width:430px;text-align:center;}
.fp-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px;}
.fp-sub{font-size:14px;color:var(--text2);margin-bottom:1.25rem;}
.fp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1.25rem;}
.f-opt{border-radius:12px;padding:0.6rem 0.4rem;cursor:pointer;border:2px solid transparent;background:var(--bg2);text-align:center;}
.f-opt.sel{border-color:var(--coral);background:var(--coral-l);}
.f-opt.prem{opacity:0.4;pointer-events:none;}
.f-emoji{font-size:26px;display:block;}
.f-name{font-size:10px;color:var(--text2);margin-top:2px;}.f-latin{font-size:9px;color:var(--text3);font-style:italic;display:block;margin-top:1px;}
.fp-add{width:100%;padding:0.9rem;border-radius:14px;border:none;font-size:15px;font-weight:700;color:#fff;background:var(--grad);cursor:pointer;font-family:inherit;}
.fp-skip{margin-top:10px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);font-family:inherit;}

/* JOURNAL VIEW — lecture seule */
.jv-hdr{position:sticky;top:0;z-index:20;padding:0.75rem 1rem 0.5rem;display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--border);background:var(--paper);}
.jv-nav{display:flex;align-items:center;justify-content:space-between;padding:0.5rem 1rem;background:var(--paper);border-bottom:0.5px solid var(--border);}
.jv-nav-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:22px;padding:4px 8px;border-radius:8px;}
.jv-nav-btn:disabled{opacity:0.25;cursor:default;}
.jv-counter{font-size:13px;color:var(--text2);}
.jv-page{padding:1.25rem 1rem 1.25rem 48px;min-height:60vh;background-color:var(--paper);background-image:linear-gradient(var(--margin) 0,var(--margin) 100%),repeating-linear-gradient(transparent,transparent 35px,var(--line) 35px,var(--line) 36.5px);background-size:1.5px 100%,100% 36.5px;background-position:38px 0,0 0;background-repeat:no-repeat,repeat;position:relative;}
.jv-date{font-size:22px;font-weight:700;margin-bottom:4px;}
.jv-type{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:1rem;}
.jv-text{line-height:2;white-space:pre-wrap;word-break:break-word;position:relative;z-index:2;}
.jv-section-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin:1.25rem 0 4px;}
.jv-slot{border-left:2px solid;padding:4px 0 4px 10px;margin-bottom:8px;line-height:1.9;}
.jv-slot-num{font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:2px;opacity:0.6;}
.jv-deep{border-radius:12px;padding:0.85rem;margin-top:1rem;border:1px dashed;}
.jv-free-layer{position:absolute;top:0;left:0;right:0;min-height:100%;pointer-events:none;}
.jv-photo{position:absolute;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.jv-sticker{position:absolute;line-height:1;}.jv-sticker img{}
.jv-edit-btn{display:flex;align-items:center;gap:6px;margin:1rem 0;padding:0.7rem 1rem;border-radius:13px;border:0.5px solid var(--border);background:var(--paper);cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit;width:100%;}

/* TO-DO LIST */
.todo-wrap{overflow:hidden;border-top:0.5px solid var(--border);border-bottom:0.5px solid var(--border);background:var(--paper);width:100%;}
.todo-hdr{padding:1rem 1.25rem;background:var(--grad);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.todo-hdr-title{font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.todo-hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0;}
.todo-hdr-date{font-size:12px;color:rgba(255,255,255,0.9);text-align:right;}
.todo-progress{font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,0.25);padding:3px 10px;border-radius:20px;white-space:nowrap;}
.todo-list{background:var(--paper);}
.todo-item{display:flex;align-items:center;gap:12px;padding:13px 1.25rem;border-bottom:0.5px solid var(--border);}
.todo-item:last-of-type{border-bottom:none;}
.todo-cb{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;}
.todo-cb.empty{border:2.5px solid var(--violet);}
.todo-cb.done{border:2.5px solid var(--orange);background:var(--orange-l);}
.todo-text{font-size:15px;flex:1;line-height:1.4;color:var(--text);min-width:0;word-break:break-word;}
.todo-text.done{text-decoration:line-through;color:var(--text3);}
.todo-del{background:none;border:none;cursor:pointer;color:#FFB3BA;padding:6px;display:flex;align-items:center;font-size:18px;flex-shrink:0;}
.todo-del:hover{color:var(--pink);}
.todo-footer{padding:12px 1.25rem;display:flex;gap:10px;border-top:0.5px solid var(--border);background:var(--paper);}
.todo-input{flex:1;padding:10px 14px;border-radius:12px;border:1.5px dashed var(--violet);background:none;font-size:14px;color:var(--text);font-family:inherit;outline:none;min-width:0;}
.todo-input::placeholder{color:#CABFFF;}
.todo-mic{padding:12px 20px;border-radius:12px;background:var(--grad);border:none;cursor:pointer;font-size:15px;color:#fff;font-family:inherit;font-weight:700;display:flex;align-items:center;gap:7px;flex-shrink:0;}
.todo-mic.rec{animation:pulseMic 1.5s infinite;}
.todo-empty{text-align:center;padding:2.5rem 1rem;font-size:15px;color:var(--text3);font-style:italic;}
/* FAQ */
.faq-item{border-bottom:0.5px solid var(--border);overflow:hidden;}
.faq-item:last-child{border-bottom:none;}
.faq-q{padding:13px 1rem;cursor:pointer;font-size:14px;font-weight:500;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:8px;user-select:none;}
.faq-q-icon{font-size:12px;color:var(--text3);flex-shrink:0;transition:transform 0.2s;}
.faq-q.open .faq-q-icon{transform:rotate(180deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height 0.3s ease;padding:0 1rem;}
.faq-a.open{max-height:300px;padding-bottom:12px;}
.faq-a-text{font-size:13px;color:var(--text2);line-height:1.7;}
/* Menu radial stickers */
.radial-overlay{position:fixed;inset:0;z-index:90;background:transparent;}
.radial-item{position:fixed;width:52px;height:52px;background:var(--paper);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,0.18);cursor:pointer;border:1.5px solid var(--border);z-index:91;transform:scale(0);transition:transform 0.18s cubic-bezier(.34,1.56,.64,1);}
.radial-item.show{transform:scale(1);}
.radial-item img{width:34px;height:34px;object-fit:contain;pointer-events:none;}

.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#2C2010;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* PRINT STYLES */
@media print {
  .bottom-nav,.j-hdr,.toolbar,.mic-hero-wrap,.save-btn,.print-t,.rec-bar{display:none!important;}
  .j-page{background:white!important;background-image:none!important;}
  #app{padding-bottom:0!important;}
  .j-inner{padding:1rem!important;}
  .scrap-wrap{page-break-inside:avoid;}
}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════
// STICKERS — système src/emoji : remplace src par ton PNG base64 Procreate
// Pour remplacer: mettre src:"data:image/png;base64,XXXXXX" à la place de src:null
// ═══════════════════════════════════════════════════════

    {id:'sarao',     emoji:'🩷', name:'Washi coeurs', src:"https://raw.githubusercontent.com/Petale14/Petale14/main/stickers/Sarao.png"},
    {id:'sin',       emoji:'☀️', name:'Soleil',        src:"https://raw.githubusercontent.com/Petale14/Petale14/main/stickers/Sin.png"},
    {id:'arcopink',  emoji:'🌈', name:'Arc violet',   src:"https://raw.githubusercontent.com/Petale14/Petale14/main/stickers/arco-pink.png"},
    {id:'flame',     emoji:'🔥', name:'Flamme',       src:"https://raw.githubusercontent.com/Petale14/Petale14/main/stickers/flame.png"},

// Helper positions stickers/photos dans les vues lecture
function calcItemPos(item, pageOffsetW, leftPad){
  const lp=leftPad||48;const rp=16;
  const viewContentW=Math.max((pageOffsetW||380)-lp-rp,200);
  const refContentW=item.refW||viewContentW;
  const scale=viewContentW/refContentW;
  const xPx=item.xPx!==undefined?item.xPx:(item.xPct||0)*refContentW/100;
  const yPx=item.yPx!==undefined?item.yPx:(item.yPct||0)*(item.refH||400)/100;
  return {x:lp+xPx*scale, y:yPx*scale, scale};
}

function findStickerDef(id){
  return [...STICKER_DEFS.free,...STICKER_DEFS.premium].find(s=>s.id===id);
}

function applyTheme(id){
  const t=THEMES[id]||THEMES.sunset;
  const r=document.documentElement;
  const keys=['--coral','--orange','--pink','--violet',
    '--coral-l','--orange-l','--pink-l','--violet-l',
    '--coral-d','--orange-d','--pink-d','--violet-d',
    '--paper','--line','--margin','--text','--text2','--text3',
    '--bg2','--border','--grad'];
  keys.forEach(k=>r.style.setProperty(k,t[k]));
  state.theme=id;save();
}

function currentTheme(){return THEMES[state.theme||'sunset']||THEMES.sunset;}

// STORAGE — Capacitor Preferences avec fallback localStorage
// ═══════════════════════════════════════════════════════
async function saveAsync(){
  try{
    const data=JSON.stringify(state);
    if(window.Capacitor?.Plugins?.Preferences){
      await window.Capacitor.Plugins.Preferences.set({key:SK,value:data});
    }
    // Toujours sauvegarder aussi dans localStorage comme backup
    localStorage.setItem(SK,data);
  }catch(e){try{localStorage.setItem(SK,JSON.stringify(state));}catch(e2){}}
}
function save(){
  // Synchrone pour compatibilité + async pour Capacitor
  try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}
  saveAsync().catch(()=>{});
}
async function loadAsync(){
  try{
    if(window.Capacitor?.Plugins?.Preferences){
      const result=await window.Capacitor.Plugins.Preferences.get({key:SK});
      if(result?.value){
        const parsed=JSON.parse(result.value);
        state={...state,...parsed};
        checkPremiumExpiration();
        return;
      }
    }
  }catch(e){}
  // Fallback localStorage
  try{const s=localStorage.getItem(SK);if(s)state={...state,...JSON.parse(s)};}catch(e){}
  checkPremiumExpiration();
}
function load(){
  // Charger depuis localStorage d'abord (synchrone)
  try{const s=localStorage.getItem(SK);if(s)state={...state,...JSON.parse(s)};}catch(e){}
  checkPremiumExpiration();
  // Puis essayer Capacitor Preferences (async) et merger si plus récent
  if(window.Capacitor?.Plugins?.Preferences){
    window.Capacitor.Plugins.Preferences.get({key:SK}).then(result=>{
      if(result?.value){
        try{
          const parsed=JSON.parse(result.value);
          // Merger intelligemment — prendre le plus complet
          const capEntries=Object.keys(parsed.entries||{}).length;
          const localEntries=Object.keys(state.entries||{}).length;
          if(capEntries>=localEntries){
            state={...state,...parsed};
            checkPremiumExpiration();
            // Re-render si déjà affiché
            if(state.seen)renderHome();
          }
        }catch(e){}
      }
    }).catch(()=>{});
  }
}

function toggleVoice(fid){if(recRunning&&activeField===fid)stopVoice();else startVoice(fid);}
function startVoice(fid){
  activeField=fid;const ta=document.getElementById(fid);
  preRecText=ta?(ta.value||''):'';accumulated='';
  userStopped=false;recRunning=true;updateRecUI(true);startSession();
}
function startSession(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){recRunning=false;updateRecUI(false);return;}
  recognition=new SR();
  const lang=state.lang==='en'?'en-US':state.lang==='es'?'es-ES':'fr-FR';
  recognition.lang=lang;
  recognition.interimResults=true;
  recognition.continuous=false;
  recognition.maxAlternatives=1;
  // On stocke le texte actuel du champ comme point de départ
  const ta2=document.getElementById(activeField);
  const sessionBase=ta2?ta2.value:preRecText+(preRecText&&accumulated?' ':'')+accumulated;
  let lastInterim='';
  recognition.onresult=e=>{
    const lastResult=e.results[e.results.length-1];
    if(!lastResult)return;
    const ta=document.getElementById(activeField);
    if(lastResult.isFinal){
      // Ajoute seulement les nouveaux mots finaux à sessionBase
      const t=lastResult[0].transcript.trim();
      accumulated=(sessionBase?sessionBase+' ':'')+t;
      lastInterim='';
      if(ta){ta.value=accumulated;ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}
    } else {
      lastInterim=lastResult[0].transcript;
      if(ta){
        ta.value=sessionBase+(sessionBase&&lastInterim?' ':'')+lastInterim;
        ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';
      }
    }
  };
  recognition.onend=()=>{
    if(!userStopped&&recRunning){
      // Avant de redémarrer, on met à jour preRecText avec ce qui est dans le champ
      const ta=document.getElementById(activeField);
      if(ta)preRecText=ta.value;
      accumulated='';
      setTimeout(startSession,150);
    }else{recRunning=false;updateRecUI(false);}
  };
  recognition.onerror=e=>{if(!userStopped&&recRunning&&(e.error==='no-speech'||e.error==='audio-capture'))setTimeout(startSession,200);else{recRunning=false;updateRecUI(false);}};
  try{recognition.start();}catch(e){setTimeout(startSession,300);}
}
function stopVoice(){userStopped=true;recRunning=false;if(recognition)try{recognition.stop();}catch(e){}updateRecUI(false);}
function updateRecUI(on){
  const tr=T();document.getElementById('rec-bar').classList.toggle('on',on);
  if(on){document.getElementById('rec-bar-txt').textContent=tr.rec;document.getElementById('rec-stop').textContent=tr.stop;}
  ['g','f','i'].forEach(p=>{const b=document.getElementById('mh-'+p);if(!b)return;b.classList.toggle('rec',on&&activeField&&activeField.startsWith(p));});
}

function spawnPhoto(src,sz,opacity,xPct,yPct,xPxDirect,yPxDirect){
  const wrap=document.getElementById('scrap-wrap');if(!wrap)return;
  let x,y;
  if(xPxDirect!==undefined){
    x=xPxDirect;y=yPxDirect;
  } else {
    const pw=wrap.offsetWidth||300;const ph=Math.max(wrap.scrollHeight||wrap.offsetHeight,220);
    const xp=xPct!==null&&xPct!==undefined?xPct:Math.random()*70+5;
    const yp=yPct!==null&&yPct!==undefined?yPct:Math.random()*50+5;
    x=xp*pw/100;y=yp*ph/100;
  }
  const s=sz||110;const op=opacity!==undefined?opacity:1;
  const el=document.createElement('div');el.className='free-item is-photo';el.style.cssText=`left:${x}px;top:${y}px;`;
  const img=document.createElement('img');img.src=src;
  img.style.cssText=`max-width:${s}px;max-height:${s}px;object-fit:contain;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,0.15);display:block;opacity:${op};`;
  el.appendChild(img);
  const ob=document.createElement('div');ob.className='opacity-bar';
  const sl=document.createElement('input');sl.type='range';sl.min='0.1';sl.max='1';sl.step='0.05';sl.value=String(op);
  sl.oninput=()=>img.style.opacity=sl.value;
  sl.addEventListener('mousedown',e=>e.stopPropagation());
  sl.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  const cls=document.createElement('button');cls.textContent='✕';
  cls.addEventListener('mousedown',e=>{e.stopPropagation();ob.style.display='none';});
  ob.appendChild(sl);ob.appendChild(cls);el.appendChild(ob);
  img.addEventListener('click',e=>{
    e.stopPropagation();const wasOpen=ob.style.display==='flex';
    document.querySelectorAll('.opacity-bar').forEach(b=>b.style.display='none');
    ob.style.display=wasOpen?'none':'flex';
  });
  const del=mkDel(el);el.appendChild(del);
  const rh=mkRh(el,img,'photo');el.appendChild(rh);
  el.addEventListener('mousedown',e=>dStart(e,el,wrap));
  el.addEventListener('touchstart',e=>dStartT(e,el,wrap),{passive:false});
  el.addEventListener('dblclick',()=>el.remove());
  wrap.appendChild(el);updateScrapHeight();
}
function restorePhoto(p){
  const wrap=document.getElementById('scrap-wrap');if(!wrap)return;
  if(p.xPx!==undefined){
    spawnPhoto(p.src,p.w,p.opacity,null,null,p.xPx,p.yPx);
  } else {
    spawnPhoto(p.src,p.w,p.opacity,p.xPct,p.yPct);
  }
}

function mkDel(el){
  const b=document.createElement('button');b.className='i-del';b.textContent='×';
  b.addEventListener('mousedown',e=>e.stopPropagation());
  b.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  b.onclick=e=>{e.stopPropagation();el.remove();};return b;
}
function mkRh(el,img,type){
  const rh=document.createElement('div');rh.className='rh';
  const startRz=e=>{
    e.stopPropagation();e.preventDefault();rz={el,img,type};
    rzS=type==='photo'?(parseInt(img?.style.maxWidth)||110):(parseInt(el.style.fontSize)||28);
    const er=el.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;const cy=e.touches?e.touches[0].clientY:e.clientY;
    rzD=Math.hypot(cx-er.left,cy-er.top)||1;
    document.addEventListener('mousemove',doRz);document.addEventListener('mouseup',endRz);
    document.addEventListener('touchmove',doRzT,{passive:false});document.addEventListener('touchend',endRz);
  };
  rh.addEventListener('mousedown',startRz);rh.addEventListener('touchstart',startRz,{passive:false});return rh;
}
function doRz(e){if(!rz)return;const er=rz.el.getBoundingClientRect();applyRz(Math.max(20,Math.min(220,rzS*(Math.hypot(e.clientX-er.left,e.clientY-er.top)/rzD))));}
function doRzT(e){if(!rz)return;e.preventDefault();const t=e.touches[0];const er=rz.el.getBoundingClientRect();applyRz(Math.max(20,Math.min(220,rzS*(Math.hypot(t.clientX-er.left,t.clientY-er.top)/rzD))));}
function applyRz(sz){if(!rz)return;if(rz.type==='photo'&&rz.img){rz.img.style.maxWidth=sz+'px';rz.img.style.maxHeight=sz+'px';}else if(rz.type==='sticker'){rz.el.style.fontSize=sz+'px';const img=rz.el.querySelector('img');if(img){img.style.width=sz+'px';img.style.height=sz+'px';}}}
function endRz(){rz=null;document.removeEventListener('mousemove',doRz);document.removeEventListener('mouseup',endRz);document.removeEventListener('touchmove',doRzT);document.removeEventListener('touchend',endRz);updateScrapHeight();}

// ═══════════════════════════════════════════════════════
// DRAG
// ═══════════════════════════════════════════════════════
function dStart(e,el,wrap){
  if(e.target.classList.contains('i-del')||e.target.classList.contains('rh'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;
  e.stopPropagation();e.preventDefault();drag=el;
  const er=el.getBoundingClientRect();dox=e.clientX-er.left;doy=e.clientY-er.top;
  document.addEventListener('mousemove',dMove);document.addEventListener('mouseup',dEnd);
}
function dMove(e){
  if(!drag)return;const pr=drag.parentElement.getBoundingClientRect();
  const mh=Math.max(drag.parentElement.scrollHeight||drag.parentElement.offsetHeight,220);
  drag.style.left=Math.max(0,Math.min(pr.width-20,e.clientX-pr.left-dox))+'px';
  drag.style.top=Math.max(0,Math.min(mh-20,e.clientY-pr.top-doy))+'px';
}
// Grandir le scrap-wrap pour contenir tous les stickers/photos → scroll correct
function updateScrapHeight(){
  const wrap=document.getElementById('scrap-wrap');if(!wrap)return;
  let maxBottom=0;
  wrap.querySelectorAll('.free-item').forEach(el=>{
    const top=parseFloat(el.style.top)||0;
    const imgEl=el.querySelector('img');
    const sz=parseInt(el.style.fontSize)||80;
    const h=imgEl?(parseInt(imgEl.style.maxHeight)||parseInt(imgEl.style.height)||sz+20):sz+20;
    maxBottom=Math.max(maxBottom,top+h+60);
  });
  if(maxBottom>0){
    let spacer=wrap.querySelector('.scrap-spacer');
    if(!spacer){
      spacer=document.createElement('div');
      spacer.className='scrap-spacer';
      spacer.style.cssText='display:block;width:1px;pointer-events:none;';
      wrap.appendChild(spacer);
    }
    spacer.style.height=maxBottom+'px';
  }
}

function dEnd(){drag=null;document.removeEventListener('mousemove',dMove);document.removeEventListener('mouseup',dEnd);updateScrapHeight();}
function dStartT(e,el,wrap){
  if(e.target.classList.contains('i-del')||e.target.classList.contains('rh'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;
  e.stopPropagation();e.preventDefault();drag=el;
  const t=e.touches[0];const er=el.getBoundingClientRect();dox=t.clientX-er.left;doy=t.clientY-er.top;
  document.addEventListener('touchmove',dMoveT,{passive:false});document.addEventListener('touchend',dEndT);
}
function dMoveT(e){
  if(!drag)return;e.preventDefault();const t=e.touches[0];
  const pr=drag.parentElement.getBoundingClientRect();const mh=Math.max(drag.parentElement.scrollHeight||drag.parentElement.offsetHeight,220);
  drag.style.left=Math.max(0,Math.min(pr.width-20,t.clientX-pr.left-dox))+'px';
  drag.style.top=Math.max(0,Math.min(mh-20,t.clientY-pr.top-doy))+'px';
}
function dEndT(){drag=null;document.removeEventListener('touchmove',dMoveT);document.removeEventListener('touchend',dEndT);updateScrapHeight();}

// SAVE
// ═══════════════════════════════════════════════════════
function saveJ(jid){
  const ek=jid+'__'+(currentEntryDate||today());
  if(jid==='intime'){
    const photos=[];
    document.querySelectorAll('#scrap-wrap .free-item.is-photo').forEach(el=>{
      const img=el.querySelector('img');const sl=el.querySelector('input[type=range]');
      if(!img?.src)return;
      photos.push({src:img.src,xPx:parseFloat(el.style.left)||0,yPx:parseFloat(el.style.top)||0,w:parseInt(img.style.maxWidth)||110,opacity:parseFloat(sl?.value)||1});
    });
    const stickers=[];
    document.querySelectorAll('#scrap-wrap .free-item.is-sticker').forEach(el=>{
      stickers.push({sid:el.dataset.sid||'',emoji:el.dataset.emoji||'⭐',xPx:parseFloat(el.style.left)||0,yPx:parseFloat(el.style.top)||0,sz:parseInt(el.style.fontSize)||28});
    });
    state.entries[ek]={text:document.getElementById('i-ta').value.trim(),photos,stickers,typo:state.typo,color:state.color};
  } else if(jid==='gratitude'){
    const slots=[0,1,2].map(i=>document.getElementById(`g-s${i}`)?.value.trim()||'');
    if(!slots.some(s=>s)){showToast(state.lang==='en'?'✏️ Write at least one thought!':state.lang==='es'?'✏️ ¡Escribe al menos un pensamiento!':'✏️ Écris au moins une pensée !');return;}
    state.entries[ek]={text:slots.filter(s=>s).join(' | '),slots,typo:state.typo,color:state.color};
  } else {
    const slots=[0,1,2].map(i=>document.getElementById(`f-s${i}`)?.value.trim()||'');
    const deep=[0,1,2].map(i=>document.getElementById(`f-d${i}`)?.value.trim()||'');
    state.entries[ek]={text:slots.filter(s=>s).join(' | '),slots,deep};
  }
  save();showToast(state.lang==='en'?'✅ Saved!':state.lang==='es'?'✅ Guardado!':'✅ Enregistré !');
}

function filterJournal(){
  const tr=T();const query=(document.getElementById('jnl-search')?.value||'').toLowerCase();
  const entries=document.getElementById('jnl-entries');entries.innerHTML='';
  // Collect all entries
  const all=[];
  Object.keys(state.entries).forEach(key=>{
    const parts=key.split('__');if(parts.length<2)return;
    const[jid,date]=parts;const entry=state.entries[key];
    if(!entry?.text?.trim())return;
    if(jnlFilter!=='all'&&jnlFilter!==jid)return;
    if(query&&!entry.text.toLowerCase().includes(query)&&!date.includes(query))return;
    all.push({jid,date,entry});
  });
  all.sort((a,b)=>b.date.localeCompare(a.date));
  if(!all.length){entries.innerHTML=`<div class="jnl-empty">${tr.jnlEmpty}</div>`;return;}
  all.forEach(({jid,date,entry})=>{
    const j=tr.journals.find(x=>x.id===jid)||{icon:'📝',name:jid,bg:'#F5F5F5',brd:'#DDD',acc:'#888',dk:'#333'};
    const card=document.createElement('div');card.className='jnl-card';
    card.style.background=j.bg;card.style.borderColor=j.brd;
    const preview=entry.text.substring(0,100)+(entry.text.length>100?'…':'');
    const photoCount=entry.photos?.length||0;const stickerCount=entry.stickers?.length||0;
    card.innerHTML=`
      <div class="jnl-card-date" style="color:${j.dk}">${fmtDate(date)}</div>
      <span class="jnl-card-type" style="background:${j.bg};color:${j.acc};border:1px solid ${j.brd}">${j.icon} ${j.name}</span>
      <div class="jnl-card-text">${preview}</div>
      <div class="jnl-card-meta">
        ${photoCount?`<span>📷 ${photoCount}</span>`:''}
        ${stickerCount?`<span>✨ ${stickerCount}</span>`:''}
        ${entry.slots?.filter(s=>s).length?`<span>✍️ ${entry.slots.filter(s=>s).length} ${state.lang==='en'?'thoughts':state.lang==='es'?'pensamientos':'pensées'}</span>`:''}
      </div>`;
    card.onclick=()=>openJournalView(jid,date,all.map(e=>({jid:e.jid,date:e.date})));
    entries.appendChild(card);
  });
}

let calendarDate=new Date();
function renderCalendar(date){
  const year=date.getFullYear();const month=date.getMonth();const today=new Date();const todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const tr=T();const monthNames=state.lang==='en'?['January','February','March','April','May','June','July','August','September','October','November','December']:state.lang==='es'?['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']:['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const weekDays=state.lang==='en'?['M','T','W','T','F','S','S']:state.lang==='es'?['L','M','X','J','V','S','D']:['L','M','M','J','V','S','D'];
  const wd=document.getElementById('cal-weekdays');if(wd){wd.innerHTML=weekDays.map(d=>`<div class="cal-weekday">${d}</div>`).join('');}
  document.getElementById('cal-month-title').textContent=monthNames[month]+' '+year;
  const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();
  const cal=document.getElementById('stats-cal');cal.innerHTML='';
  const startDay=(firstDay===0)?6:firstDay-1;
  for(let i=0;i<startDay;i++){const cell=document.createElement('div');cell.className='cal-day other-month';cal.appendChild(cell);}
  for(let day=1;day<=daysInMonth;day++){
    const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const hasEntryToday=['gratitude','frustration','intime'].some(j=>hasEntry(state.entries[j+'__'+dateStr]));
    const hasFlower=state.garden.some(f=>f.date===dateStr);
    const isActive=hasEntryToday||hasFlower;
    const isToday=dateStr===todayStr;
    const cell=document.createElement('div');
    cell.className='cal-day'+(isToday?' today':'')+(isActive?' active':'');
    cell.textContent=day;
    if(isActive){const flower=document.createElement('span');flower.className='cal-day-flower';flower.textContent='🌸';cell.appendChild(flower);}
    cal.appendChild(cell);
  }
  calendarDate=new Date(year,month,1);
}
function calPrevMonth(){const prev=new Date(calendarDate);prev.setMonth(prev.getMonth()-1);renderCalendar(prev);}
function calNextMonth(){const next=new Date(calendarDate);next.setMonth(next.getMonth()+1);renderCalendar(next);}

// JOURNAL VIEW — lecture seule, navigation entre pages
// ═══════════════════════════════════════════════════════
let jvList=[];let jvIdx=0;

function openJournalView(jid,date,list){
  jvList=list||[{jid,date}];
  jvIdx=jvList.findIndex(e=>e.jid===jid&&e.date===date);
  if(jvIdx<0)jvIdx=0;
  show('journal-view');
  renderJournalView();
}

function closeJournalView(){
  navTo('journal');
}

function jvNavigate(dir){
  const next=jvIdx+dir;
  if(next<0||next>=jvList.length)return;
  jvIdx=next;renderJournalView();
  document.getElementById('jv-page').scrollTop=0;window.scrollTo(0,0);
}

function renderJournalView(){
  const tr=T();const {jid,date}=jvList[jvIdx];
  const j=tr.journals.find(x=>x.id===jid);if(!j)return;
  const ek=jid+'__'+date;const saved=state.entries[ek];if(!saved)return;
  // Utiliser typo/couleur de l'entrée, pas le state global
  const entryTypoId=saved.typo||state.typo;
  const entryColor=saved.color||state.color||'#2C2010';
  const ty=TYPOS.find(t=>t.id===entryTypoId)||TYPOS[0];

  // Header
  document.getElementById('jv-title').textContent=j.icon+' '+j.name;
  document.getElementById('jv-title').style.color=j.dk;
  document.getElementById('jv-edit-btn').onclick=()=>openJ(jid,date);
  document.getElementById('jv-counter').textContent=(jvIdx+1)+' / '+jvList.length;
  const prev=document.getElementById('jv-prev');const next=document.getElementById('jv-next');
  prev.disabled=jvIdx===0;next.disabled=jvIdx===jvList.length-1;
  prev.style.color=jvIdx===0?'var(--text3)':'var(--text2)';
  next.style.color=jvIdx===jvList.length-1?'var(--text3)':'var(--text2)';

  const page=document.getElementById('jv-page');page.innerHTML='';

  // Date + type badge
  const dateDiv=document.createElement('div');dateDiv.className='jv-date';dateDiv.style.color=j.dk;dateDiv.textContent=fmtDate(date);page.appendChild(dateDiv);
  const badge=document.createElement('span');badge.className='jv-type';badge.style.cssText=`background:${j.bg};color:${j.acc};border:1px solid ${j.brd};`;badge.textContent=j.icon+' '+j.name;page.appendChild(badge);

  if(jid==='gratitude'){
    // 3 pensées
    (saved.slots||[]).forEach((s,i)=>{
      if(!s.trim())return;
      const wrap=document.createElement('div');wrap.className='jv-slot';wrap.style.borderLeftColor=j.acc;wrap.style.background=j.bg+'88';
      wrap.innerHTML=`<div class="jv-slot-num" style="color:${j.acc}">${j.nums?.[i]||`${i+1}.`}</div><div class="jv-text" style="font-family:${ty.f};font-size:${ty.sz};color:${state.color};-webkit-text-fill-color:${state.color};">${s}</div>`;
      page.appendChild(wrap);
    });
  } else if(jid==='frustration'){
    // 3 frustrations
    const slbl=document.createElement('div');slbl.className='jv-section-lbl';slbl.style.color=j.acc;slbl.textContent=j.prompt||'';page.appendChild(slbl);
    (saved.slots||[]).forEach((s,i)=>{
      if(!s.trim())return;
      const wrap=document.createElement('div');wrap.className='jv-slot';wrap.style.borderLeftColor=j.acc;wrap.style.background=j.bg+'88';
      wrap.innerHTML=`<div class="jv-slot-num" style="color:${j.acc}">${j.nums?.[i]||`${i+1}.`}</div><div class="jv-text" style="font-family:${ty.f};font-size:${ty.sz};color:${state.color};-webkit-text-fill-color:${state.color};">${s}</div>`;
      page.appendChild(wrap);
    });
    // Deep section
    const deepItems=(saved.deep||[]).filter(s=>s.trim());
    if(deepItems.length){
      const deep=document.createElement('div');deep.className='jv-deep';deep.style.cssText=`border-color:${j.acc};background:${j.bg}66;`;
      deep.innerHTML=`<div class="jv-section-lbl" style="color:${j.acc};margin-top:0;"><i class="ti ti-bulb"></i> ${j.deepLbl||''}</div>`;
      deepItems.forEach((s,i)=>{
        const d=document.createElement('div');d.className='jv-slot';d.style.borderLeftColor=j.acc+'88';
        d.innerHTML=`<div class="jv-slot-num" style="color:${j.acc}">${j.nums?.[i]||`${i+1}.`}</div><div class="jv-text" style="font-family:${ty.f};font-size:${ty.sz};color:${entryColor};-webkit-text-fill-color:${entryColor};">${s}</div>`;
        deep.appendChild(d);
      });
      page.appendChild(deep);
    }
  } else {
    // INTIME — texte + photos + stickers
    const textDiv=document.createElement('div');textDiv.className='jv-text';
    textDiv.style.cssText=`font-family:${ty.f};font-size:${ty.sz};color:${entryColor};-webkit-text-fill-color:${entryColor};`;
    textDiv.textContent=saved.text||'';
    page.appendChild(textDiv);

    // Canvas identique à l'édition — positions directes
    const canvas=document.createElement('div');canvas.className='petale-canvas';
    const textDiv2=document.createElement('div');textDiv2.className='jv-text';
    textDiv2.style.cssText=textDiv.style.cssText;textDiv2.textContent=saved.text||'';
    canvas.appendChild(textDiv2);
    if((saved.photos?.length||0)+(saved.stickers?.length||0)>0){
      const layer=document.createElement('div');layer.className='jv-free-layer';
      (saved.photos||[]).forEach(p=>{
        const img=document.createElement('img');img.src=p.src;
        img.className='jv-photo';img.style.cssText=`left:${p.xPx||0}px;top:${p.yPx||0}px;max-width:${p.w||110}px;max-height:${p.w||110}px;object-fit:contain;opacity:${p.opacity||1};`;
        layer.appendChild(img);
      });
      (saved.stickers||[]).forEach(s=>{
        const def=findStickerDef(s.sid)||{emoji:s.emoji||'⭐',src:null};
        const sz=s.sz||28;const sp=document.createElement('span');sp.className='jv-sticker';
        if(def.src){const i2=document.createElement('img');i2.src=def.src;i2.style.cssText=`width:${sz}px;height:${sz}px;object-fit:contain;`;sp.appendChild(i2);}
        else{sp.textContent=def.emoji;}
        sp.style.cssText+=`left:${s.xPx||0}px;top:${s.yPx||0}px;font-size:${sz}px;`;
        layer.appendChild(sp);
      });
      canvas.appendChild(layer);
    }
    // Remplacer textDiv par canvas dans page
    page.removeChild(textDiv);
    page.appendChild(canvas);
  }
}

    else{sp.textContent=def.emoji;}
    sp.style.cssText+=`left:${s.xPx||0}px;top:${s.yPx||0}px;font-size:${sz}px;`;
    layer.appendChild(sp);

function renderTodo(){
  const tr=T();
  document.getElementById('todo-screen-title').textContent='✅ '+( tr.navTodo||'Tâches');
  const todos=state.todos||[];
  const done=todos.filter(t=>t.done).length;
  const content=document.getElementById('todo-content');
  content.innerHTML='';

  const wrap=document.createElement('div');wrap.className='todo-wrap';

  // Header
  const hdr=document.createElement('div');hdr.className='todo-hdr';
  const d=new Date();const dateStr=d.toLocaleDateString(tr.loc,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const dateFormatted=dateStr.charAt(0).toUpperCase()+dateStr.slice(1);
  hdr.innerHTML=`
    <div class="todo-hdr-title">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="16" height="16" rx="4" stroke="white" stroke-width="1.8"/>
        <path d="M4.5 4.5 Q6.5 7.5 9 9 Q11.5 10.5 13.5 13.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M13.5 4.5 Q11 7 9 9 Q7 11 4.5 13.5" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      ${tr.navTodo||'Tâches'}
    </div>
    <div class="todo-hdr-right">
      <div class="todo-hdr-date">${dateFormatted}</div>
      <div class="todo-progress">${done} / ${todos.length} 🌸</div>
    </div>`;
  wrap.appendChild(hdr);

  // Liste
  const list=document.createElement('div');list.className='todo-list';
  if(!todos.length){
    list.innerHTML=`<div class="todo-empty">${state.lang==='es'?'¡Añade tu primera tarea!':state.lang==='en'?'Add your first task!':'Ajoute ta première tâche !'}</div>`;
  } else {
    todos.forEach((item,i)=>{
      const el=document.createElement('div');el.className='todo-item';
      el.innerHTML=`
        <div class="todo-cb ${item.done?'done':'empty'}" onclick="toggleTodo(${i})" role="checkbox" aria-checked="${item.done}">
          ${item.done?`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2.5 2.5 Q4 5 7 7 Q10 9 11.5 11.5" stroke="#FF8E53" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M11.5 2.5 Q9 5 7 7 Q5 9 2.5 11.5" stroke="#FF6FAE" stroke-width="2.2" stroke-linecap="round"/>
          </svg>`:''}
        </div>
        <span class="todo-text ${item.done?'done':''}">${item.text}</span>
        <button class="todo-del" onclick="deleteTodo(${i})" aria-label="${state.lang==='en'?'Delete':state.lang==='es'?'Eliminar':'Supprimer'}"><i class="ti ti-trash" aria-hidden="true"></i></button>`;
      list.appendChild(el);
    });
  }
  wrap.appendChild(list);

  // Footer — input + mic
  const footer=document.createElement('div');footer.className='todo-footer';
  const input=document.createElement('input');input.className='todo-input';input.id='todo-input';
  input.placeholder=state.lang==='es'?'Añadir tarea...':state.lang==='en'?'Add a task...':'Ajouter une tâche...';
  input.addEventListener('keydown',e=>{if(e.key==='Enter')addTodoItem();});
  const mic=document.createElement('button');mic.className='todo-mic'+(recRunning&&activeField==='todo-input'?' rec':'');
  mic.id='todo-mic-btn';
  mic.innerHTML=`<i class="ti ti-microphone" style="font-size:15px;" aria-hidden="true"></i> ${state.lang==='es'?'Dictar':state.lang==='en'?'Dictate':'Dicter'}`;
  mic.onclick=()=>{
    if(recRunning&&activeField==='todo-input'){stopVoice();setTimeout(addTodoItem,200);}
    else{startVoice('todo-input');}
  };
  footer.appendChild(input);footer.appendChild(mic);
  wrap.appendChild(footer);
  content.appendChild(wrap);
}

function addTodoItem(){
  const input=document.getElementById('todo-input');if(!input)return;
  const text=input.value.trim();if(!text)return;
  if(!state.todos)state.todos=[];
  state.todos.push({id:Date.now(),text,done:false});
  input.value='';save();renderTodo();
}

function toggleTodo(i){
  if(!state.todos||!state.todos[i])return;
  state.todos[i].done=!state.todos[i].done;
  save();renderTodo();
}

function deleteTodo(i){
  if(!state.todos)return;
  state.todos.splice(i,1);
  save();renderTodo();
}

// MENU RADIAL STICKERS (appui long)
// ═══════════════════════════════════════════════════════
let radialOpen=false;

function showRadialMenu(clientX,clientY,wrap){
  closeRadialMenu();
  const activeTheme=state.theme||'sunset';
  let stickers=[];
  if(state.premium&&activeTheme!=='sunset'){
    stickers=STICKER_DEFS.premium.filter(s=>s.theme===activeTheme).slice(0,6);
  }
  if(!stickers.length)stickers=STICKER_DEFS.free.slice(0,6);
  if(!stickers.length)return;
  radialOpen=true;
  const overlay=document.createElement('div');overlay.className='radial-overlay';overlay.id='radial-overlay';
  overlay.onclick=closeRadialMenu;document.body.appendChild(overlay);
  const radius=68;const count=stickers.length;
  stickers.forEach((s,i)=>{
    const angle=(i/count)*2*Math.PI - Math.PI/2;
    const sx=Math.round(Math.cos(angle)*radius);
    const sy=Math.round(Math.sin(angle)*radius);
    const item=document.createElement('div');item.className='radial-item';
    item.style.cssText=`left:${clientX+sx-26}px;top:${clientY+sy-26}px;`;
    if(s.src){const img=document.createElement('img');img.src=s.src;item.appendChild(img);}
    else{item.textContent=s.emoji;item.style.fontSize='26px';}
    item.onclick=(e)=>{
      e.stopPropagation();
      const rect=wrap.getBoundingClientRect();
      const xPx=clientX+sx-rect.left;
      const yPx=clientY+sy-rect.top+(window.pageYOffset||document.documentElement.scrollTop)-
        (wrap.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop)-
         (wrap.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop)));
      // Calcul correct position dans scrap-wrap
      const wrapDocTop=wrap.getBoundingClientRect().top+(window.pageYOffset||0);
      const wrapDocLeft=wrap.getBoundingClientRect().left+(window.pageXOffset||0);
      const finalX=(clientX+sx)+(window.pageXOffset||0)-wrapDocLeft-26;
      const finalY=(clientY+sy)+(window.pageYOffset||0)-wrapDocTop-26;
      spawnSticker(s.id,s.emoji,s.src,null,null,44,Math.max(0,finalX),Math.max(0,finalY));
      closeRadialMenu();
    };
    document.body.appendChild(item);
    setTimeout(()=>item.classList.add('show'),i*30+10);
  });
}

function closeRadialMenu(){
  radialOpen=false;
  document.getElementById('radial-overlay')?.remove();
  document.querySelectorAll('.radial-item').forEach(el=>el.remove());
}

function addLongPressToScrap(){
  const wrap=document.getElementById('scrap-wrap');if(!wrap)return;
  let timer=null,startX=0,startY=0,moved=false;
  wrap.addEventListener('touchstart',e=>{
    if(e.target.classList.contains('free-item')||e.target.closest('.free-item')||e.target.closest('.toolbar'))return;
    const t=e.touches[0];startX=t.clientX;startY=t.clientY;moved=false;
    timer=setTimeout(()=>{if(!moved)showRadialMenu(startX,startY,wrap);},500);
  },{passive:true});
  wrap.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(Math.abs(t.clientX-startX)>10||Math.abs(t.clientY-startY)>10){moved=true;clearTimeout(timer);}
  },{passive:true});
  wrap.addEventListener('touchend',()=>clearTimeout(timer),{passive:true});
  wrap.addEventListener('touchcancel',()=>clearTimeout(timer),{passive:true});
}

function generatePDF(selectedJournals){
  const tr=T();
  const allKeys=Object.keys(state.entries)
    .filter(k=>{const[jid]=k.split('__');return selectedJournals.includes(jid)&&state.entries[k]?.text?.trim();})
    .sort().reverse().slice(0,30);
  if(!allKeys.length){alert(state.lang==='en'?'No entries to export.':state.lang==='es'?'No hay entradas para exportar.':'Aucune entree a exporter.');return;}
  const win=window.open('','_blank');
  const gFonts='https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Dancing+Script:wght@400;600&family=Pacifico&family=Shadows+Into+Light&family=Patrick+Hand&display=swap';
  const entries=allKeys.map(k=>{
    const[jid,date]=k.split('__');
    const e=state.entries[k];
    const j=tr.journals.find(x=>x.id===jid)||{name:jid,icon:'📝',acc:'#FF6B6B',dk:'#8B2500'};
    const ty=TYPOS.find(t=>t.id===e.typo)||TYPOS[0];
    const col=e.color||'#2C2010';
    const ds=new Date(date+'T12:00:00').toLocaleDateString(tr.loc,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const text=(e.slots?e.slots.filter(s=>s).join('\n\n'):e.text)||'';
    let maxB=0;
    (e.stickers||[]).forEach(s=>{maxB=Math.max(maxB,(s.yPx||0)+(s.sz||28)+20);});
    (e.photos||[]).forEach(p=>{maxB=Math.max(maxB,(p.yPx||0)+(p.w||110)+20);});
    const ch=maxB>0?maxB+40:null;
    const sh=(e.stickers||[]).map(s=>{
      const def=findStickerDef(s.sid)||{emoji:s.emoji||'⭐',src:null};const sz=s.sz||28;
      if(def.src)return '<img src="'+def.src+'" style="position:absolute;left:'+(s.xPx||0)+'px;top:'+(s.yPx||0)+'px;width:'+sz+'px;height:'+sz+'px;object-fit:contain;">';
      return '<span style="position:absolute;left:'+(s.xPx||0)+'px;top:'+(s.yPx||0)+'px;font-size:'+sz+'px;line-height:1;">'+def.emoji+'</span>';
    }).join('');
    const ph=(e.photos||[]).map(p=>{
      const w=p.w||110;
      return '<img src="'+p.src+'" style="position:absolute;left:'+(p.xPx||0)+'px;top:'+(p.yPx||0)+'px;max-width:'+w+'px;max-height:'+w+'px;object-fit:contain;opacity:'+(p.opacity||1)+';">';
    }).join('');
    return '<div class="pe"><div class="ed" style="color:'+j.dk+'">'+j.icon+' '+ds+'</div><div class="et" style="background:'+j.acc+'22;color:'+j.acc+';border:1px solid '+j.acc+'44;">'+j.name+'</div><div class="ec" style="position:relative;overflow:visible;'+(ch?'height:'+ch+'px;':'min-height:40px;')+'"><div class="etx" style="font-family:'+ty.f+';font-size:'+ty.sz+';color:'+col+';line-height:2;white-space:pre-wrap;">'+text+'</div>'+ph+sh+'</div></div>';
  }).join('');
  const css='*{box-sizing:border-box;margin:0;padding:0;}body{background:#FFFBF8;font-family:-apple-system,sans-serif;padding:32px 24px;color:#2C2010;}.hdr{text-align:center;margin-bottom:48px;padding-bottom:24px;border-bottom:2px solid #FFE0CC;}.ht{font-size:28px;font-weight:700;background:linear-gradient(135deg,#FF6B6B,#FF8E53,#FF6FAE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}.hs{font-size:13px;color:#C0A898;margin-top:6px;}.pe{background:#FFFBF8;background-image:linear-gradient(rgba(255,107,174,0.2) 0,rgba(255,107,174,0.2) 100%),repeating-linear-gradient(transparent,transparent 35px,#F0E8E0 35px,#F0E8E0 36px);background-size:1.5px 100%,100% 36px;background-position:38px 0,0 0;background-repeat:no-repeat,repeat;border-radius:12px;padding:1.5rem 1rem 2.5rem 52px;margin-bottom:3rem;page-break-inside:avoid;page-break-after:always;border:0.5px solid #F0DDD0;overflow:visible;}.ed{font-size:18px;font-weight:700;margin-bottom:6px;}.et{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;margin-bottom:14px;}.ec{position:relative;overflow:visible;}.etx{position:relative;z-index:2;}.pb{position:fixed;bottom:20px;right:20px;padding:12px 24px;background:linear-gradient(135deg,#FF6B6B,#FF6FAE);color:#fff;border:none;border-radius:12px;cursor:pointer;font-size:14px;font-weight:700;}@media print{.pb{display:none;}body{padding:16px;}@page{margin:1cm;}}';
  const btnTxt=state.lang==='en'?'Print / Save PDF':state.lang==='es'?'Imprimir / Guardar PDF':'Imprimer / Sauvegarder en PDF';
  const subTxt=state.lang==='en'?'My journal':'Mon journal';
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Petale</title><link href="'+gFonts+'" rel="stylesheet"><style>'+css+'</style></head><body><div class="hdr"><div class="ht">🌸 Petale</div><div class="hs">'+subTxt+' — '+new Date().toLocaleDateString(tr.loc)+'</div></div>'+entries+'<button class="pb" onclick="window.print()">'+btnTxt+'</button></body></html>');
  win.document.close();
}


// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
function showToast(msg){
  const t=document.getElementById('save-toast');if(!t)return;
  t.textContent=msg||(state.lang==='en'?'✅ Saved!':state.lang==='es'?'✅ Guardado!':'✅ Enregistré !');
  t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),3000);
}
function clearToast(){const t=document.getElementById('save-toast');if(!t)return;clearTimeout(t._timer);t.classList.remove('show');}

// ═══════════════════════════════════════════════════════
// PWA + INIT
// ═══════════════════════════════════════════════════════
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();state.premium=!!state.premium;
applyTheme(state.theme||'sunset');
if(state.seen){renderHome();navTo('home');checkFlower();}else renderOb();

// ═══════════════════════════════════════════════════════
// ANDROID BACK BUTTON
// ═══════════════════════════════════════════════════════
document.addEventListener('backbutton',function(e){
  e.preventDefault();
  const active=document.querySelector('.screen.active');
  if(!active)return;
  const id=active.id.replace('screen-','');
  const journalScreens=['gratitude','frustration','intime','journal-view','history','journal'];
  if(journalScreens.includes(id)){navTo('home');}
  else if(id==='stats'||id==='todo'||id==='settings'){navTo('home');}
},false);

// Fallback via popstate pour WebView
history.pushState(null,null,window.location.href);
window.addEventListener('popstate',function(){
  history.pushState(null,null,window.location.href);
  const active=document.querySelector('.screen.active');
  if(!active)return;
  const id=active.id.replace('screen-','');
  if(id!=='home'&&id!=='ob'){navTo('home');}
});
</script>
